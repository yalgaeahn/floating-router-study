schema_version = 2
name = "floating-island-q1-q3-convergence-ncut-7"

[circuit]
path = "../circuits/floating_island_q1_q3.yaml"

[sweep]
paths = ["common"]
idle = { phi3_over_pi = 0.0, phi4_over_pi = 0.0 }

[[sweep.axes]]
name = "phi_over_pi"
unit = "over_pi"
minimum = 0.0
maximum = 1.0
points = 21

[methods]
exact = true
schrieffer_wolff = true

[numerics]
preset = "converged"

[numerics.components.Q1]
truncated_dim = 4
ncut = 7

[numerics.components.Q3]
truncated_dim = 4
ncut = 7

[numerics.components.R]
truncated_dim = 20
ncut = 7

[numerics.backends.schrieffer_wolff]
maximum_order = 5

[output]
directory = "../results"
basename = "q1-q3-convergence-ncut-7-v2.h5"
