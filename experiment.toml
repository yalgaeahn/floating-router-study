schema_version = 2
name = "floating-island-q1-q3-smoke"

[circuit]
path = "circuits/floating_island_q1_q3.yaml"

[sweep]
paths = ["common"]
idle = { phi3_over_pi = 0.0, phi4_over_pi = 0.0 }

[[sweep.axes]]
name = "phi_over_pi"
unit = "over_pi"
minimum = 0.0
maximum = 0.1
points = 2

[methods]
exact = true
schrieffer_wolff = true

[numerics]
preset = "smoke"

[numerics.components.Q1]
truncated_dim = 3
ncut = 4

[numerics.components.Q3]
truncated_dim = 3
ncut = 4

[numerics.components.R]
truncated_dim = 6
ncut = 4

[numerics.backends.schrieffer_wolff]
maximum_order = 5

[output]
directory = "results"
basename = "q1-q3-smoke-v2.h5"
